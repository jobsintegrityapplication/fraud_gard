global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: handset-fraud-platform
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:8000]
    # host.docker.internal resolves on Docker Desktop for Windows and macOS.
    # On Linux, add the host-gateway mapping shown in OBSERVABILITY.md.

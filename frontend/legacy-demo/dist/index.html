<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Handset Fraud Platform</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f5f7fa; }
    button, input { padding: 10px; margin: 4px; }
    .card { background: white; padding: 18px; margin: 12px 0; border-radius: 10px; box-shadow: 0 1px 5px #ccc; }
    pre { white-space: pre-wrap; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Autonomous Handset Fraud Management</h1>
  <div class="card">
    <button type="button" onclick="generateData()">1. Generate 10K Data</button>
    <button type="button" onclick="trainModels()">2. Train Models</button>
    <button type="button" onclick="discoverPatterns()">3. Discover Patterns</button>
    <button type="button" onclick="scoreSamples()">4. Score Sample Transactions</button>
    <button type="button" onclick="loadAlerts()">5. Refresh Alerts</button>
    <button type="button" onclick="loadCases()">6. Refresh Cases</button>
    <button type="button" onclick="loadMetrics()">Metrics</button>
  </div>
  <div class="card">
    <h2>Score one transaction</h2>
    <input id="txnId" placeholder="transaction id">
    <button type="button" onclick="scoreOne()">Score</button>
  </div>
  <div class="card"><h2>Status</h2><pre id="status"></pre></div>
  <div class="card"><h2>Metrics</h2><pre id="metrics"></pre></div>
  <div class="card"><h2>Alerts</h2><div id="alerts"></div></div>
  <div class="card"><h2>Cases</h2><div id="cases"></div></div>
  <div class="card"><h2>Patterns</h2><pre id="patterns"></pre></div>
  <script>
    let lastFraudIds = [];
    async function api(u, m='GET', body) {
      const opts = { method: m, headers: {} };
      if (body) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const r = await fetch(u, opts);
      const text = await r.text();
      let j;
      try { j = JSON.parse(text); } catch { j = { detail: text }; }
      if (!r.ok) throw new Error(j.detail || text || r.status);
      return j;
    }
    function show(id, data) {
      document.getElementById(id).textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }
    async function generateData() {
      try {
        const j = await api('/api/v1/demo/generate','POST');
        lastFraudIds = j.sample_fraud_ids || [];
        if (j.sample_ids && j.sample_ids[0]) document.getElementById('txnId').value = (lastFraudIds[0] || j.sample_ids[0]);
        show('status', j);
      } catch (e) { show('status', 'Generate failed: ' + e.message); }
    }
    async function trainModels() {
      try { show('status', await api('/api/v1/train','POST')); }
      catch (e) { show('status', 'Train failed: ' + e.message); }
    }
    async function discoverPatterns() {
      try {
        const j = await api('/api/v1/patterns/discover','POST');
        show('patterns', j);
        show('status', { discovered: Array.isArray(j) ? j.length : j });
      } catch (e) { show('status', 'Discover failed: ' + e.message); }
    }
    async function scoreOne() {
      const id = document.getElementById('txnId').value.trim();
      if (!id) { show('status', 'Enter a transaction id'); return; }
      try {
        show('status', await api('/api/v1/score','POST', { transaction_id: id }));
        await loadAlerts();
      } catch (e) { show('status', 'Score failed: ' + e.message); }
    }
    async function scoreSamples() {
      try {
        let ids = lastFraudIds.slice();
        if (!ids.length) {
          const tx = await api('/api/v1/transactions?limit=50');
          ids = tx.filter(t => t.label === 1).map(t => t.id).slice(0, 5);
          if (!ids.length) ids = tx.map(t => t.id).slice(0, 3);
        }
        const results = [];
        for (const id of ids) results.push(await api('/api/v1/score','POST', { transaction_id: id }));
        show('status', results);
        await loadAlerts();
      } catch (e) { show('status', 'Sample score failed: ' + e.message); }
    }
    async function loadMetrics() {
      try { show('metrics', await api('/api/v1/metrics')); }
      catch (e) { show('metrics', 'Metrics failed: ' + e.message); }
    }
    async function loadAlerts() {
      try {
        const a = await api('/api/v1/alerts');
        document.getElementById('alerts').innerHTML = a.length ? a.map(x =>
          `<div class="card"><b>${x.risk}</b> — ${x.transaction_id}<pre>${x.reasons}</pre><button type="button" onclick="makeCase(${x.id})">Create Case</button></div>`
        ).join('') : '<p>No alerts yet. Train, then score sample transactions.</p>';
      } catch (e) { document.getElementById('alerts').textContent = 'Alerts failed: ' + e.message; }
    }
    async function makeCase(id) {
      try {
        const r = await api('/api/v1/cases/from-alert/' + id, 'POST');
        show('status', r);
        await loadCases();
      } catch (e) { show('status', 'Create case failed: ' + e.message); }
    }
    async function loadCases() {
      try {
        const rows = await api('/api/v1/cases');
        document.getElementById('cases').innerHTML = rows.length ? rows.map(x =>
          `<div class="card"><b>${x.id}</b> ${x.status} ${x.decision || ''}
            <div>
              <button type="button" onclick="decide('${x.id}','CONFIRMED_FRAUD')">Confirm fraud</button>
              <button type="button" onclick="decide('${x.id}','NOT_FRAUD')">Not fraud</button>
              <button type="button" onclick="decide('${x.id}','NEED_MORE_EVIDENCE')">Need evidence</button>
              <button type="button" onclick="decide('${x.id}','UNCERTAIN')">Uncertain</button>
            </div>
          </div>`
        ).join('') : '<p>No cases yet.</p>';
      } catch (e) { document.getElementById('cases').textContent = 'Cases failed: ' + e.message; }
    }
    async function decide(caseId, decision) {
      try {
        show('status', await api('/api/v1/cases/' + caseId + '/decision', 'POST', { decision, reason: 'dashboard' }));
        await loadCases();
        await loadMetrics();
      } catch (e) { show('status', 'Decision failed: ' + e.message); }
    }
  </script>
</body>
</html>

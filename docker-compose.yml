name: handset-fraud-mvp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-fraud-password}
      POSTGRES_DB: ${POSTGRES_DB:-fraud}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio:
    build:
      context: ./docker/minio
      args:
        MINIO_SERVER_TAG: RELEASE.2025-04-22T22-12-26Z
        MINIO_MC_TAG: RELEASE.2025-04-16T18-13-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
      MC_HOST_local: http://${MINIO_ROOT_USER:-local-minio-user}:${MINIO_ROOT_PASSWORD:-local-minio-password}@127.0.0.1:9000
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing local/mlflow-artifacts
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg://${POSTGRES_USER:-fraud_dev}:${POSTGRES_PASSWORD:-local-dev-fraud-password}@postgres:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination
      - s3://mlflow-artifacts
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-local-minio-user}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-local-minio-password}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: "true"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fraud_dev}:${POSTGRES_PASSWORD:-local-dev-fraud-password}@postgres:5432/${POSTGRES_DB:-fraud}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fraud_dev}:${POSTGRES_PASSWORD:-local-dev-fraud-password}@postgres:5432/${POSTGRES_DB:-fraud}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      DEV_AUTH_ROLE: ${DEV_AUTH_ROLE:-ADMIN}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-local-minio-user}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-local-minio-password}
      AWS_DEFAULT_REGION: us-east-1
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-console}
      GRAPH_BACKEND: ${GRAPH_BACKEND:-networkx}
      DRIFT_PSI_WARNING: ${DRIFT_PSI_WARNING:-0.10}
      DRIFT_PSI_CRITICAL: ${DRIFT_PSI_CRITICAL:-0.25}
      DRIFT_RETRAINING_RECOMMENDATION_POLICY: ${DRIFT_RETRAINING_RECOMMENDATION_POLICY:-warning}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - app-data:/app/data
      - model-data:/app/models
      - report-data:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/fraud-console
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    profiles: [neo4j]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-local-neo4j-password}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_AUTH%%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  local-llm:
    image: ollama/ollama:0.11.4
    profiles: [local-llm]
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  app-data:
  model-data:
  report-data:
  prometheus-data:
  grafana-data:
  neo4j-data:
  ollama-data:
